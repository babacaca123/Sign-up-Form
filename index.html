<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="container">
   <div class="panel-left">
    <div class="logo-container">
        <img src="images/24EggsLogo.png" alt="Logo" class="logo">
    </div>
   </div> 
    <div class="panel-right">
        <h1>Join us today!</h1>
        <p>Get <strong>three free trays </strong>when you sign up and share with five people.</p>
        <fieldset>
            <div class="field">
                <label for="first-name">First Name</label>
                <input type="text" id="first-name" first-name="first-name" placeholder = "John" required pattern="[A-Za-z\s]+">
            </div>
            <div class="field">    
                <label for="last-name">Last Name</label>
                <input type="text" id="last-name" last-name="last-name" placeholder = "Doe" required pattern="[A-Za-z\s]+">
            </div>
            <div class="field">    
                <label for="email">Email</label>
                <input type="email" id="email" email="email" required>
            </div>  
            <div class="field">    
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" phone="phone" required pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" placeholder="123-456-7890">
            </div>
            <div class="field">    
                <label for="password">Password</label>
                <input type="password" id="password" password="password">
            </div>
            <div class="field">    
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" confirm-password="confirm-password">
            </div>
                <button type="submit">Sign Up</button>  

            

        </fieldset>

    </div>
</div>

<script src="script.js"></script>
</body>
</html>
